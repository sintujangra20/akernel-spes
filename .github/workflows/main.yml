name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to build"
        required: true
        type: choice
        options:
          - akernel-12-15
          - clean-12-15
          - main
          - root-12-15

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev libncurses-dev zip unzip python3 perl wget

      - name: Build kernel
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build-output.txt

      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.branch }}
          path: |
            *.zip
            build-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-${{ inputs.branch }}
          path: build-output.txt
          if-no-files-found: ignore
